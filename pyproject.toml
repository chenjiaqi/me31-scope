[project]
name = "me31-scope"
version = "0.1.0"
description = "ME31-XDXX0400 四通道 PT100 温度采集上位机（RS485 / Modbus RTU）"
readme = "README.md"
authors = [
    { name = "jiakie", email = "chenjiaqi77@dingtalk.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
]

[project.scripts]
me31-scope = "me31_scope:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
